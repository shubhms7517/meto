<style>
  :root {
    --bg: #12070d; --surface: #1d1418; --card: #241c20; --line: rgba(255,255,255,.08);
    --text: #f6e9ee; --muted: #b9a3ad; --dim: #7d6872;
    --rose-1: #ff5f8f; --rose-2: #d81b5c; --gold-1: #f6dc9b; --gold-2: #d9ae55; --gold-ink: #3a2608;
    --green: #3ee08f; --red: #ff5f7a; --blue: #7fb0ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Poppins, system-ui, sans-serif; background: #0b0408; color: var(--text); padding: 32px 28px 60px; }
  header.page h1 { font-size: 24px; } header.page p { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
  .shot { margin-top: 30px; } .shot > figcaption { margin-top: 10px; color: var(--muted); font-size: 13px; } .shot > figcaption b { color: var(--text); }
  .win { border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,.1); box-shadow: 0 30px 60px -30px rgba(0,0,0,.9); background: var(--bg); }
  .bar { height: 34px; display: flex; align-items: center; gap: 7px; padding: 0 14px; background: #1a1015; border-bottom: 1px solid var(--line); }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #3a2a31; } .bar span { margin-left: 14px; font-size: 11.5px; color: var(--dim); }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 560px; }
  .side { background: radial-gradient(120% 60% at 0% 0%, #3a0f24, #170a10 60%); border-right: 1px solid var(--line); padding: 18px 12px; }
  .logo { font-size: 22px; font-weight: 800; font-style: italic; color: var(--gold-1); padding: 0 8px 4px; } .logo small { font-size: 10px; font-style: normal; color: var(--rose-1); margin-left: 6px; letter-spacing: .1em; }
  .nav { margin-top: 18px; display: flex; flex-direction: column; gap: 2px; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 11px; font-size: 13px; color: var(--muted); text-decoration: none; }
  .nav a.on { color: #fff; background: linear-gradient(100deg, rgba(255,95,143,.22), rgba(255,95,143,.06)); }
  .nav a .n { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; display: grid; place-items: center; font-size: 10.5px; font-weight: 800; color: #fff; background: var(--rose-1); }
  .nav .sep { margin: 12px 10px 4px; font-size: 10px; letter-spacing: .1em; color: var(--dim); }
  .main { padding: 22px 26px; }
  .top { display: flex; align-items: center; gap: 12px; } .top h2 { font-size: 20px; } .top .sub { color: var(--muted); font-size: 12px; }
  .top .me { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); } .top .me i { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--gold-1), var(--gold-2)); }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 18px; }
  .kpi { padding: 14px 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
  .kpi small { font-size: 11.5px; color: var(--muted); } .kpi b { display: block; font-size: 24px; margin-top: 4px; } .kpi em { font-style: normal; font-size: 11px; color: var(--green); }
  .kpi.gold b { color: var(--gold-1); }
  .grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; margin-top: 14px; }
  .card { border-radius: 16px; background: var(--card); border: 1px solid var(--line); padding: 14px 16px; }
  .card h3 { font-size: 14px; display: flex; justify-content: space-between; align-items: center; } .card h3 a { font-size: 11.5px; color: var(--rose-1); font-weight: 600; text-decoration: none; }
  .chart { height: 150px; margin-top: 12px; display: flex; align-items: flex-end; gap: 8px; }
  .chart div { flex: 1; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, var(--rose-1), rgba(216,27,92,.35)); }
  .chart div.g { background: linear-gradient(180deg, var(--gold-1), rgba(217,174,85,.35)); }
  .lg { display: flex; gap: 14px; margin-top: 8px; font-size: 11px; color: var(--muted); } .lg i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; }
  .todo { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .todo div { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.04); font-size: 12.5px; }
  .todo div b { margin-left: auto; color: var(--rose-1); }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12.5px; }
  th { text-align: left; font-weight: 600; color: var(--dim); font-size: 11px; letter-spacing: .04em; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .who { display: flex; align-items: center; gap: 10px; } .who i { width: 34px; height: 34px; border-radius: 50%; flex: none; } .who small { display: block; color: var(--dim); font-size: 11px; }
  .pill { display: inline-block; padding: 3px 9px; border-radius: 9px; font-size: 11px; font-weight: 700; }
  .p-pend { color: var(--gold-1); background: rgba(246,220,155,.12); } .p-ok { color: var(--green); background: rgba(62,224,143,.12); } .p-no { color: var(--red); background: rgba(255,95,122,.12); } .p-blue { color: var(--blue); background: rgba(127,176,255,.12); }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 14px; border-radius: 10px; font-size: 12px; font-weight: 700; border: 0; color: #fff; }
  .b-rose { background: linear-gradient(100deg, var(--rose-1), var(--rose-2)); } .b-ghost { background: rgba(255,255,255,.08); color: var(--text); } .b-green { background: linear-gradient(100deg, #3ee08f, #1aa864); color: #062615; } .b-red { background: rgba(255,95,122,.16); color: var(--red); }
  .acts { display: flex; gap: 6px; justify-content: flex-end; }
  .tabs { display: flex; gap: 6px; margin-top: 14px; } .tabs span { padding: 7px 12px; border-radius: 11px; font-size: 12px; color: var(--muted); background: rgba(255,255,255,.05); } .tabs span.on { color: #fff; background: rgba(255,95,143,.2); }
  .search { margin-left: auto; width: 260px; height: 34px; border-radius: 11px; padding: 0 12px; display: flex; align-items: center; font-size: 12px; color: var(--dim); background: var(--card); border: 1px solid var(--line); }
  .split { display: grid; grid-template-columns: 1fr 380px; gap: 14px; margin-top: 14px; }
  .review .media { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .review .media i { height: 96px; border-radius: 12px; display: grid; place-items: center; font-style: normal; font-size: 10.5px; color: rgba(255,255,255,.7); }
  .review .vid { margin-top: 8px; height: 130px; border-radius: 12px; background: linear-gradient(135deg, #3a1a2a, #160a10); display: grid; place-items: center; font-size: 12px; color: var(--muted); border: 1px solid var(--line); }
  .kv { margin-top: 10px; font-size: 12px; display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; } .kv span { color: var(--dim); }
  .reason { margin-top: 10px; height: 38px; border-radius: 10px; padding: 0 10px; display: flex; align-items: center; font-size: 12px; color: var(--dim); background: rgba(255,255,255,.05); border: 1px solid var(--line); }
  .chat { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .m { max-width: 80%; padding: 9px 12px; border-radius: 14px; font-size: 12.5px; } .m small { display: block; font-size: 10px; opacity: .7; margin-top: 3px; }
  .m.u { align-self: flex-start; background: #2c2227; } .m.t { align-self: flex-end; background: linear-gradient(135deg, var(--rose-1), var(--rose-2)); }
  .compose { display: flex; gap: 8px; margin-top: 12px; } .compose div { flex: 1; height: 40px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 12px; color: var(--dim); background: rgba(255,255,255,.05); border: 1px solid var(--line); }
  .set { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 14px; }
  .field { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; } .field:last-child { border: 0; }
  .field small { display: block; font-size: 10.5px; color: var(--dim); }
  .field .in { min-width: 90px; height: 32px; border-radius: 9px; padding: 0 10px; display: flex; align-items: center; justify-content: flex-end; font-weight: 700; background: rgba(255,255,255,.06); border: 1px solid var(--line); }
  .warn { margin-top: 12px; padding: 10px 12px; border-radius: 12px; font-size: 11.5px; color: var(--gold-1); background: rgba(246,220,155,.07); border: 1px solid rgba(246,220,155,.25); }
  .g1{background:linear-gradient(135deg,#ff9ab8,#8e0f3c)} .g2{background:linear-gradient(135deg,#c9a6ff,#4f2fb3)} .g3{background:linear-gradient(135deg,#ffcf8a,#8a5a12)} .g4{background:linear-gradient(135deg,#7fb0ff,#1f3f8e)} .g5{background:linear-gradient(135deg,#9ad7c8,#1f6e5e)}
  .login { min-height: 520px; display: grid; place-items: center; background: radial-gradient(70% 60% at 50% 0%, #4a1230, #12070d 70%); }
  .lbox { width: 360px; padding: 26px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); text-align: center; }
  .lbox .logo { font-size: 30px; padding: 0; } .lbox p { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .lbox .f { height: 44px; margin-top: 12px; border-radius: 12px; padding: 0 14px; display: flex; align-items: center; font-size: 13px; color: var(--dim); background: rgba(255,255,255,.05); border: 1px solid var(--line); text-align: left; }
  .lbox .btn { width: 100%; height: 46px; margin-top: 16px; font-size: 14px; }
  .lbox .note { margin-top: 12px; font-size: 11px; color: var(--dim); }
</style>
</head>
