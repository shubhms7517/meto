<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meto agency invite QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #12070d; color: #f6e9ee; display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .card { background: #1d1418; border: 1px solid rgba(255,255,255,.1); border-radius: 20px; padding: 28px; text-align: center; max-width: 420px; }
  h1 { font-size: 20px; margin: 0 0 4px; color: #f6dc9b; }
  p { color: #b9a3ad; font-size: 13px; margin: 4px 0 18px; }
  #qr { background: #fff; padding: 16px; border-radius: 14px; display: inline-block; }
  code { display: block; margin-top: 16px; font-size: 12px; color: #ff9db8; word-break: break-all; }
  .agency { margin-top: 14px; font-size: 13px; color: #b9a3ad; }
  .agency b { color: #f6e9ee; }
</style>
</head>
<body>
  <div class="card">
    <h1>Meto · Become a host</h1>
    <p>Scan this with your phone camera to open the app's host-invite screen</p>
    <div id="qr"></div>
    <code>meto://join?agency=AG1045</code>
    <div class="agency">Agency: <b>Star Agency</b> · code <b>AG1045</b></div>
  </div>
  <script>
    new QRCode(document.getElementById('qr'), { text: 'meto://join?agency=AG1045', width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M });
  </script>
</body>
</html>
